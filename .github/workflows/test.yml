name: test

on:
  push:
  pull_request:

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate bundled IR database
        run: python3 tools/build_ir_db.py
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
